<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal · Thoithoi’s Tales</title>
  <meta name="description" content="Journal entries by Ayesha Binte Mostofa: notes, sketches and thoughts from the studio.">
  <meta name="theme-color" content="#2f4a3a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Journal · Thoithoi’s Tales">
  <meta property="og:image" content="https://ayeshathoi.github.io/Illustrated-writing/assets/share.webp">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600&family=Tiro+Bangla&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261124051027">
</head>
<body class="site">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html" data-site-title>Thoithoi’s Tales</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav-links" id="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="index.html#stories">Stories</a>
        <a href="journal.html">Journal</a>
      </nav>
    </div>
  </header>

  <div class="page-banner" aria-hidden="true"></div>
  <main class="wrap page-main">
    <!-- list of entries -->
    <section id="list-view" hidden>
      <div class="page-head">
        <p class="eyebrow">Essays &amp; notes</p>
        <h1 class="section-title">Journal</h1>
        <p class="section-sub">Essays, reflections and notes from the studio.</p>
      </div>
      <div class="journal-grid" id="entries"></div>
      <p class="empty" id="no-entries" hidden>No journal entries yet.</p>
    </section>

    <!-- one entry -->
    <article class="article" id="entry-view" hidden>
      <a class="text-link back-link" href="journal.html">← All entries</a>
      <header class="article-head">
        <time id="entry-date"></time>
        <h1 class="article-title" id="entry-title"></h1>
        <p class="byline" data-if-owner>Written by <strong data-owner></strong></p>
      </header>
      <div class="prose" id="entry-body"></div>
      <section class="comments" id="entry-comments" hidden></section>
    </article>

    <p class="empty" id="not-found" hidden>That entry could not be found. <a class="text-link" href="journal.html">See all entries</a></p>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div><a class="brand" href="index.html" data-site-title>Thoithoi’s Tales</a><p class="small footer-tag" data-site-tagline></p></div>
      <nav class="footer-links" aria-label="Footer"><a href="index.html#stories">Stories</a><a href="journal.html">Journal</a></nav>
      <p class="footer-copy small">© <span data-year>2026</span> <span data-owner>Ayesha Binte Mostofa</span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/sky.js?v=20261124051027"></script>
  <script src="assets/site.js?v=20261124051027"></script>
  <script src="assets/markup.js?v=20261124051027"></script>
  <script src="assets/comments.js?v=20261124051027"></script>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get("entry");
      if (!id) {
        document.getElementById("list-view").hidden = false;
        fetch("journal/index.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : { entries: [] }).then((d) => {
          const entries = d.entries || [];
          document.getElementById("no-entries").hidden = entries.length > 0;
          document.getElementById("entries").innerHTML = entries.map(journalCard).join("");
        }).catch(() => (document.getElementById("no-entries").hidden = false));
        return;
      }
      if (!/^[a-z0-9-]+$/.test(id)) return (document.getElementById("not-found").hidden = false);
      fetch(`journal/${id}/entry.json`, { cache: "no-cache" })
        .then((r) => { if (!r.ok) throw 0; return r.json(); })
        .then((e) => {
          document.getElementById("entry-view").hidden = false;
          if (/[\u0980-\u09FF]/.test(e.title + e.body)) { document.getElementById("entry-title").lang = "bn"; document.getElementById("entry-body").lang = "bn"; }
          document.title = `${e.title} · Journal`;
          document.getElementById("entry-date").textContent = formatDate(e.date);
          document.getElementById("entry-title").textContent = e.title;
          document.getElementById("entry-body").innerHTML = renderMarkup(e.body, `journal/${encodeURIComponent(e.id)}`);
          siteReady.then((site) => mountComments(document.getElementById("entry-comments"), "journal:" + e.id, site.commentsUrl));
        })
        .catch(() => (document.getElementById("not-found").hidden = false));
    })();
  </script>
</body>
</html>
