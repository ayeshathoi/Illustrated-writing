<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual story · Thoithoi’s Tales</title>
  <meta name="theme-color" content="#2f4a3a">
  <meta property="og:image" content="https://ayeshathoi.github.io/Illustrated-writing/assets/share.webp">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600&family=Tiro+Bangla&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261124051027">
</head>
<body class="site">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html" data-site-title>Thoithoi’s Tales</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav-links" id="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="index.html#stories">Stories</a>
        <a href="journal.html">Journal</a>
      </nav>
    </div>
  </header>
  <div class="story-progress" aria-hidden="true"><div id="progress"></div></div>
  <button class="music-fab" id="music-btn" hidden aria-label="Play music" title="Play music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
  </button>

  <div class="page-banner" aria-hidden="true"></div>
  <main class="wrap page-main story" id="story" hidden>
    <a class="text-link back-link" href="index.html#stories">← All stories</a>
    <header class="article-head">
      <span class="badge visual">Visual story</span>
      <h1 class="article-title" id="title"></h1>
      <p class="byline" id="author" hidden></p>
      <p class="story-desc" id="desc" hidden></p>
    </header>
    <div id="scenes"></div>
    <div class="story-end">
      <p class="the-end">The End</p>
      <a class="btn" href="index.html#stories">More stories</a>
    </div>
    <section class="comments" id="comments" hidden></section>
  </main>
  <p class="empty wrap" id="not-found" hidden>That story could not be found. <a class="text-link" href="index.html">Back to the library</a></p>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div><a class="brand" href="index.html" data-site-title>Thoithoi’s Tales</a><p class="small footer-tag" data-site-tagline></p></div>
      <nav class="footer-links" aria-label="Footer"><a href="index.html#stories">Stories</a><a href="journal.html">Journal</a></nav>
      <p class="footer-copy small">© <span data-year>2026</span> <span data-owner>Ayesha Binte Mostofa</span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/sky.js?v=20261124051027"></script>
  <script src="assets/site.js?v=20261124051027"></script>
  <script src="assets/comments.js?v=20261124051027"></script>
  <script src="assets/music.js?v=20261124051027"></script>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get("book") || "";
      const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
      const fail = () => (document.getElementById("not-found").hidden = false);
      if (!/^[a-z0-9-]+$/.test(id)) return fail();
      fetch(`books/${id}/book.json`, { cache: "no-cache" })
        .then((r) => { if (!r.ok) throw 0; return r.json(); })
        .then((b) => {
          if (!b.published && !isLocal) throw 0;
          document.getElementById("story").hidden = false;
          document.title = `${b.title} · Visual story`;
          document.getElementById("title").textContent = b.title;
          if (b.author) { const a = document.getElementById("author"); a.hidden = false; a.innerHTML = `By <strong>${esc(b.author)}</strong>`; }
          if (b.description) { const d = document.getElementById("desc"); d.hidden = false; d.textContent = b.description; }
          const caps = b.captions || {};
          document.getElementById("scenes").innerHTML = b.pages.map((p, i) => `
            <section class="story-scene">
              <figure><img src="books/${encodeURIComponent(b.id)}/${encodeURIComponent(p)}" alt="Scene ${i + 1}" loading="${i < 2 ? "eager" : "lazy"}"></figure>
              ${caps[p] ? `<div class="scene-text">${esc(caps[p]).split(/\n\s*\n/).map((t) => `<p>${t.replace(/\n/g, "<br>")}</p>`).join("")}</div>` : ""}
            </section>`).join("");
          // Gentle fade-in as each scene scrolls into view
          const io = "IntersectionObserver" in window && new IntersectionObserver((items) => {
            items.forEach((it) => { if (it.isIntersecting) { it.target.classList.add("in"); io.unobserve(it.target); } });
          }, { rootMargin: "0px 0px -10% 0px" });
          document.querySelectorAll(".story-scene").forEach((s) => (io ? io.observe(s) : s.classList.add("in")));
          siteReady.then((site) => mountComments(document.getElementById("comments"), "book:" + b.id, site.commentsUrl));
          setupBookMusic(b, document.getElementById("music-btn"));
        })
        .catch(fail);
      const bar = document.getElementById("progress");
      addEventListener("scroll", () => {
        const max = document.documentElement.scrollHeight - innerHeight;
        bar.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
      }, { passive: true });
    })();
  </script>
</body>
</html>
